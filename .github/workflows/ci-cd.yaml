# GitHub Actions docs: https://docs.github.com/en/actions/how-tos/write-workflows
# Reference syntax: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# Env. variables: https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-variables#default-environment-variables
# Add'l variables: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts

# Publishes to PyPI via trusted publishing (OIDC), so no PyPI token secret is needed
# (see https://docs.pypi.org/trusted-publishers/)

# The action pins in this file are bumped by Dependabot PRs (weekly, Friday; see .github/dependabot.yml).

name: Test and deploy release
on:
  # Pushes run only for the long-lived branches and release tags; any other branch (e.g. Dependabot's) is tested via
  # its pull_request event instead of twice. Once `branches` filters push, tags only trigger if listed explicitly.
  # Test any other branch on demand with: gh workflow run ci-cd.yaml --ref <branch>
  push:
    branches: [main, unreleased]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN (the repository default is write); the deploy job raises its own permissions.
permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PYTHONUNBUFFERED: 1
  PYTHONUTF8: 1

jobs:
  # A release push updates multiple refs pointing to the same commit (e.g. main and the v* tag, pushed together),
  # and GitHub fires a separate workflow run for each ref. This job detects, for a branch push, whether the commit
  # is also tagged on the remote; if so the tag's own run covers it and the branch run's test matrix is skipped.
  check-skip:
    name: Check for duplicate tag run
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.tagged.outputs.skip }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check whether this commit is also tagged
        id: tagged
        if: github.event_name == 'push' && github.ref_type == 'branch'
        # git ls-remote lists '<sha> refs/tags/<tag>' plus, for annotated tags, a peeled '<commit sha> ...^{}'
        # line, so matching the commit SHA at line start covers both lightweight and annotated tags.
        run: |
          if git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" | grep -q "^${GITHUB_SHA}"; then
            echo "Commit ${GITHUB_SHA} is also tagged; its tag's run covers it, so skipping this branch run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    # matrix.* values are defined below in strategy.
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    # A hung test (e.g. a browser that never returns) would otherwise run until the 6-hour default.
    timeout-minutes: 30

    needs: [check-skip]
    if: needs.check-skip.outputs.skip != 'true'

    # A strategy creates a build matrix for your jobs. You can define different variations to run each job in.
    strategy:
      # Let every combination finish, so that one failing (or flaky) job doesn't cancel and hide the others' results
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        # Python versions at https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
        # RCs need to be specified fully, e.g. '3.13.0-rc.3', or use allow-prereleases: true in setup-python.
        # For free-threaded, we only test the latest version
        python-version: ['3.15t', '3.15', '3.14', '3.13', '3.12']

    env:
      TELEGRAM_TOKEN: ${{ secrets.telegram_token }}  # for telegram testing
      UV_SYSTEM_PYTHON: 1  # for uv, turns on --system by default

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Checks out a copy of the repository per https://github.com/actions/checkout
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build Python and packages per https://github.com/actions/setup-python
      # Using actions/setup-python can be faster than uv, because GitHub caches the Python versions alongside the runner.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # Install uv per https://github.com/astral-sh/setup-uv/blob/main/README.md
      # and https://docs.astral.sh/uv/guides/integration/github
      # Caching is enabled on GitHub-hosted runners
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # PyYAML has no Python 3.15 wheels, so it is built from source, and on Windows building its optional libyaml C
      # extension fails the install; PYYAML_FORCE_LIBYAML=0 builds the pure-Python version instead. It goes to
      # $GITHUB_ENV because a plain `$env:` assignment would not outlive this step.
      - name: Build PyYAML without libyaml (Windows w/Python 3.15 and 3.15t)
        if: ${{ runner.os == 'Windows' && startsWith(matrix.python-version, '3.15') }}
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'PYYAML_FORCE_LIBYAML=0'

      - name: Install redis, pdf2text and ocr dependencies (Linux w/latest Python)
        # Redis easily installable on Ubuntu
        # Do full install and testing of pdf2text and ocr only on latest Python version
        if: ${{ matrix.python-version == '3.15' && runner.os == 'Linux' }}
        # https://github.com/jalan/pdftotext#os-dependencies
        # REDIS_URI goes to $GITHUB_ENV, as an `export` would not outlive this step and the Redis tests would be skipped
        run: |
          sudo apt-get update
          sudo apt-get install redis-server python3-dbus build-essential libpoppler-cpp-dev pkg-config python3-dev tesseract-ocr
          echo "REDIS_URI=redis://localhost:6379" >> "$GITHUB_ENV"
          uv pip install --upgrade pdftotext pytesseract

      - name: Install pdf2text and ocr dependencies (macOS w/latest Python)
        # Do full install and testing of pdf2text and ocr only on latest Python version
        if: ${{ matrix.python-version == '3.15' && runner.os == 'macOS' }}
        run: |
          brew update
          brew install poppler tesseract
          uv pip install --upgrade pdftotext pytesseract

      # - name: Install pdf2text and ocr dependencies (Windows w/latest Python)
      #   # Do full install and testing of pdf2text and ocr only on latest Python version
      #   if: ${{ matrix.python-version == '3.15' && runner.os == 'Windows' }}
      #   shell: pwsh
      #   run: |
      #     # Set the preference variable to display Verbose messages
      #     $VerbosePreference = "Continue"

      #     # Install Poppler
      #     # 1. install miniconda per https://conda.io/projects/conda/en/stable/user-guide/install/windows.html
      #     $condaInstallerUrl = "https://repo.anaconda.com/miniconda/Miniconda3-latest-Windows-x86_64.exe"
      #     $condaInstallerPath = "$env:TEMP\Miniconda3-setup.exe"
      #     $installDir = "$env:TEMP\Miniconda3"
      #     Invoke-WebRequest -Uri $condaInstallerUrl -OutFile $condaInstallerPath -HttpVersion 2.0
      #     # Run the installer silently
      #     Start-Process -FilePath $condaInstallerPath -ArgumentList "/RegisterPython=0 /D=$installDir" -Wait -NoNewWindow
      #     Remove-Item -Path $condaInstallerPath
      #     # 2. install Poppler using conda
      #     Start-Process -FilePath "$installDir\conda.exe" -ArgumentList "install -c conda-forge poppler --yes" -Wait -NoNewWindow

      #     # Install Tesseract
      #     # See https://github.com/UB-Mannheim/tesseract/wiki
      #     $tesseractInstallerUrl = "https://github.com/tesseract-ocr/tesseract/releases/download/5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe" # Replace with the latest version
      #     $tesseractInstallerPath = "$env:TEMP\tesseract-ocr-setup.exe"
      #     Invoke-WebRequest -Uri $tesseractInstallerUrl -OutFile $tesseractInstallerPath -HttpVersion 2.0
      #     # Run the installer silently
      #     Start-Process -FilePath $tesseractInstallerPath -ArgumentList "/S /D=C:\Program Files\Tesseract-OCR" -Wait -NoNewWindow
      #     Remove-Item -Path $tesseractInstallerPath
      #     # Add Tesseract to PATH
      #     $env:Path += ";C:\Program Files\Tesseract-OCR"
      #     echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Append

      #     # Install Python packages
      #     uv pip install --upgrade pdftotext pytesseract

      - name: Install all other dependencies (GIL)
        if: ${{ ! endsWith(matrix.python-version, 't') }}
        run: >
          uv pip install
          --upgrade
          -r tests/requirements_pytest.txt

      - name: Run tests (GIL)
        if: ${{ ! endsWith(matrix.python-version, 't') }}
        # '>' folded style scalar (allows splitting line)
        run: >
          uv run --no-project
          pytest
          -v
          --cov=./
          --cov-report=term
          --browser chromium
          --browser-channel chrome
          tests/

      - name: Install all other dependencies (free-threaded)
        if:  ${{ endsWith(matrix.python-version, 't') }}
        run: >
          uv pip install
          --upgrade
          -r tests/requirements_pytest_free-threaded.txt

      - name: Run tests (free-threaded)
        if: ${{ endsWith(matrix.python-version, 't') }}
        # '>' folded style scalar (allows splitting line)
        run: >
          uv run --no-project
          pytest
          -v
          --cov=./
          --cov-report=term
          tests/

      - name: Run storage tests with system typeguard installed (Linux w/latest Python)
        # Default tests run against the vendored typeguard (since `typeguard` is not a project dependency).
        # This step installs the upstream `typeguard` package and re-runs the storage/jobs tests so the
        # dual-import branch in webchanges/storage/_yaml.py and _config.py is also exercised. Catches
        # forward-reference resolution differences between vendored and upstream typeguard.
        # Pin to <4.5 to exercise the older `evaluate_forwardref` (the behaviour shipped by current Linux
        # distro packages); typeguard 4.5+ added a `__forward_module__` fallback that would mask the bug.
        if: ${{ matrix.python-version == '3.15' && runner.os == 'Linux' }}
        run: |
          uv pip install "typeguard<4.5"
          uv run --no-project pytest -v tests/test_storage.py tests/test_jobs.py

      - name: Write coverage data as XML
        run: uv run --no-project coverage xml
        continue-on-error: true

      # Coveralls names a build after the ref that triggered the run, which for a release is the tag, as the branch
      # runs skip their tests (see check-skip); a tag run is therefore reported as main, so that main's page updates.
      - name: Upload coverage data to coveralls.io (parallel)
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
        with:
          github-token: ${{ secrets.github_token }}
          file: coverage.xml
          format: cobertura
          flag-name: tests-${{ matrix.python-version }}-${{ matrix.os }}
          parallel: true
          git-branch: ${{ github.ref_type == 'tag' && 'main' || '' }}
          fail-on-error: false
        continue-on-error: true

  coveralls:
    name: Completion -> coveralls.io
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
      with:
        egress-policy: audit

    - name: Coveralls parallel finished
      uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true

  deploy:
    name: Deploy release
    permissions:
      contents: write  # IMPORTANT: this permission is mandatory to create the GitHub release
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    needs: [test]
    # ref https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions#github-context
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave this job's write-scoped token in .git/config; nothing below pushes with git
          persist-credentials: false

      # Refuse to publish if the tag (minus its 'v'), __version__ and the top CHANGELOG.rst section disagree, or if
      # that section is still dated 'Unreleased'.
      - name: Check that the tag matches __version__ and the CHANGELOG.rst header
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(sed -n "s/^__version__ = '\([^']*\)'.*/\1/p" webchanges/__init__.py)
          changelog_version=$(sed -n 's/^Version \([^ ]*\)$/\1/p' CHANGELOG.rst | head -n 1)
          changelog_date=$(grep -m 1 -A 2 '^Version ' CHANGELOG.rst | tail -n 1)
          echo "tag: ${tag_version} | __version__: ${pkg_version} | CHANGELOG.rst: ${changelog_version} (${changelog_date})"
          if [ "${tag_version}" != "${pkg_version}" ] || [ "${tag_version}" != "${changelog_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ (${pkg_version}) and/or the CHANGELOG.rst header (${changelog_version})"
            exit 1
          fi
          if [ "${changelog_date}" = 'Unreleased' ]; then
            echo "::error::The CHANGELOG.rst section for ${changelog_version} is still dated 'Unreleased'"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      # Install uv per https://github.com/astral-sh/setup-uv/blob/main/README.md
      # and https://docs.astral.sh/uv/guides/integration/github
      # Caching is enabled on GitHub-hosted runners
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Build using uv https://docs.astral.sh/uv/concepts/projects/build/
      - name: Build dist
        run: uv build

      # PyPI publish GitHub Action from https://github.com/pypa/gh-action-pypi-publish
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # V3.0.0
        with:
          body_path: RELEASE.md
          draft: false
          prerelease: false
          preserve_order: false
          make_latest: true
