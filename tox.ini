# tox.ini file for Tox https://tox.wiki/en/latest/config.html

# To perform most of the tests done in GitHub Actions by CI-CD but locally (i.e. before pushing) and only for
# interpreters that are already installed, run $ tox or $ tox --parallel

# At its core tox provides a convenient way to run arbitrary commands in isolated environments to serve as a single
# entry point for build, test and release activities.


[tox]
requires =
    tox >= 4.58.0
    tox-uv-bare>=1.36.0
env_list =
    # NOTE: the py factors below must stay in sync with the generative [testenv:py{...}-*] section names further down
    pre-commit
    py{314, 311}-new-install  # We install it for the current and the lowest version we support
    py{314, 313, 312, 311}-pytest
    py314-system-typeguard
    post
    docs
skip_missing_interpreters = true

[testenv]
# Settings defined here are automatically inherited by individual environments unless overridden
parallel_show_output = true
pass_env =
    REDIS_URI
    TELEGRAM_TOKEN
set_env =
    PRE_COMMIT_COLOR = always
    UV_SYSTEM_PYTHON = 0
    PYTEST_ADDOPTS = --color=yes
    PYTHONPATH = {toxinidir}
    PYTHONUTF8 = 1
    USERPROFILE = {env:TEMP:{env_tmp_dir}}
    # The default value below is Windows-only; on other systems, set WEBCHANGES_BROWSER_PATH in the outer environment
    WEBCHANGES_BROWSER_PATH = {env:WEBCHANGES_BROWSER_PATH:C:\Program Files\Google\Chrome\Application\chrome.exe}

[pkgenv]
set_env =
    UV_SYSTEM_PYTHON = 0

[testenv:pre-commit]
# Settings defined in the top-level testenv section are automatically inherited if not overwritten
description = Run pre-commit
deps =
    -rtests/requirements_pre-commit.txt
commands =
    pre-commit autoupdate
    pre-commit run --all-files --show-diff-on-failure
temp_dir = {work_dir}/.tmp_pre-commit
# skip_install = true

[testenv:py{314, 311}-new-install]
# Settings defined in the top-level testenv section are automatically inherited if not overwritten
# The section name must list the full generative env names: a plain [testenv:new-install] would NOT apply to them
description = Emulate a new installation from wheel, ensuring e.g. that all packages are installed
# Have tox build the wheel and install it (with its dependencies), like a user's `pip install webchanges` would
package = wheel
set_env =
    # A set_env here replaces (not merges with) the top-level one, so re-include it first
    {[testenv]set_env}
    # Empty value overrides the top-level PYTHONPATH so that the installed wheel, not the source tree, is imported
    PYTHONPATH =
# Run from outside the source tree so that the checkout's webchanges/ directory cannot mask a broken wheel
change_dir = {env_tmp_dir}
commands =
    webchanges --version
    # Verify that package data (e.g. the JSON schemas in webchanges/_resources) ships in the wheel
    python -c "from importlib.resources import files; files('webchanges._resources').joinpath('jobs.schema.json').read_text()"

[testenv:py{314, 313, 312, 311}-pytest]
# Settings defined in the top-level testenv section are automatically inherited if not overwritten
# The section name must list the full generative env names: a plain [testenv:pytest] would NOT apply to them
description = Run tests
deps =
    -rtests/requirements_pytest.txt
set_env =
    # A set_env here replaces (not merges with) the top-level one, so re-include it first
    {[testenv]set_env}
    # Per-environment coverage data file so that parallel runs don't clobber each other; combined by the `post` env
    COVERAGE_FILE = {toxinidir}{/}.coverage.{env_name}
    # Per-env home directory so that parallel test envs cannot collide via Path.home() (overrides the top-level
    # USERPROFILE, which is shared across envs; not done there because pre-commit's hook cache must persist in it)
    USERPROFILE = {env_tmp_dir}
commands =
    pytest -v --cov=./ --cov-report=term --browser chromium --browser-channel chrome tests/
depends =
    pre-commit
    py{314, 311}-new-install

[testenv:py314-system-typeguard]
# Run storage tests with the system `typeguard` package installed, exercising the dual-import branch in
# webchanges/storage/_yaml.py and _config.py. Without this, all tests run against the vendored typeguard, which can
# mask bugs (e.g. forward-reference resolution differences in TypedDicts) that only surface when users have an
# upstream typeguard release installed alongside webchanges.
description = Run storage tests with the upstream `typeguard` package installed
deps =
    -rtests/requirements_pytest.txt
    # Pin to <4.5 to exercise the older `evaluate_forwardref` that does not consult `__forward_module__` (the
    # behaviour shipped by current Linux distro packages). typeguard 4.5+ added a fallback that masks the bug.
    typeguard<4.5
set_env =
    # A set_env here replaces (not merges with) the top-level one, so re-include it first
    {[testenv]set_env}
    # Per-env home directory so that parallel test envs cannot collide via Path.home()
    USERPROFILE = {env_tmp_dir}
commands =
    pytest -v tests/test_storage.py tests/test_jobs.py
depends =
    pre-commit

[testenv:post]
description = Post-tests cleanup for coverage
skip_install = true
deps =
    coverage
    coverage-conditional-plugin
commands =
    coverage combine
    coverage html
    # TODO The command below works in Windows only
    cmd /c start "" "file://{toxinidir}/htmlcov/index.html"
allowlist_externals =
    cmd
depends =
    py{314, 313, 312, 311}-pytest

[testenv:docs]
description = Docs build
# We run in Python 3.14 to match the default image in our own .readthedocs.yaml
base_python = python3.14
skip_install = true
deps =
    -rdocs/requirements.txt
commands =
    sphinx-build -W -j auto docs docs/_build
    # TODO The command below works in Windows only
    cmd /c start "" "file://{toxinidir}/docs/_build/index.html"
allowlist_externals =
    cmd
