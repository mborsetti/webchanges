# Data for test cases for hooks.rst used by test_docs_hooks.py
# Each heading is a unique pseudo-url
# Ensure you use a Unicode character (e.g. ™ / &trade) in your example (both input and output) to test that too!
https://example.org/case:
  input: test
  output: TEST
https://example.org/indent:
  input: test
  output: "        test"
https://example.org/:
  input: foo
  output: bar
https://example.org/.foobar:
  input: foo
  output: bar
https://example.org/keywords:
  input: |-
    New arrivals™
    Summer SALE™ on now
    Free shipping
    10% discount™ for members
  output: |-
    Summer SALE™ on now
    10% discount™ for members
